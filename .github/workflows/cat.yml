name: Yunsu Cat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunsu-cat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests bserpy

      - name: Run bot
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ER_NICKNAME: ${{ secrets.ER_NICKNAME }}
        run: python cat_bot.py

      - name: Save seen games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_games.json
          git diff --staged --quiet || (git commit -m "update seen games" && git push)
